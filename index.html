h1{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(3rem,10vw,8.5rem);line-height:1;letter-spacing:-.01em;max-width:11ch;text-shadow:0 2px 40px rgba(0,0,0,.45)}

<body>
<header class="hero">
<h1>Barrier-Free Concert</h1>
<p class="lead">휠체어 이용자의 이동권 보장을 위해 전담 스태프를 배치한다.</p>
</header>
<main>
<h2>기획 근거</h2>
<ul>
<li>현재 VR 콘서트 상영 중인 극장에서는 휠체어석을 제공하지 않는다.</li>
<li>콘서트 장에 직접 가는 선택지 밖에 없지만, 인파 때문에 두렵다.</li>
<li>장애인 이동을 위한 전담 스태프가 배치되어 이동권이 보장된 사례가 존재한다.</li>
</ul>
</main>
<footer>작성자<b>기쁨</b></footer>
